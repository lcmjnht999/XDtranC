appId: com.xdtranc.desktop
productName: XDtranC
directories:
  output: release
  buildResources: build
files:
  - package.json
  - packages/main/dist/**
asar: true
asarUnpack:
  - "**/*.wasm"
npmRebuild: false
extraMetadata:
  main: packages/main/dist/main.mjs
win:
  target:
    - nsis
    - dir
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: XDtranC
  installerLanguages:
    - zh_CN
  language: "2052"
  artifactName: ${productName}-${version}-setup.${ext}
  deleteAppDataOnUninstall: false
